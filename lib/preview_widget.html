<h2 class="sr-only">Diagram of the change described in this merge request.</h2>
<div id="mrd-graph" style="width:100%;display:flex;justify-content:center;padding:8px 0;font-family:var(--font-sans,ui-sans-serif,system-ui)">
  <pre class="mermaid" style="background:transparent;margin:0;width:100%">
__MERMAID__
  </pre>
</div>
<div id="mrd-fallback" style="display:none;color:var(--text-muted,#666);font-size:13px;padding:8px">
  Mermaid rendering unavailable here — showing raw source (renders as a graph on the MR).
</div>
<script type="module">
  try {
    const mermaid = (await import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs')).default;
    mermaid.initialize({ startOnLoad:false, securityLevel:'loose', theme:'base',
      flowchart:{ htmlLabels:true, curve:'basis' },
      themeVariables:{ background:'transparent', primaryColor:'#f4f4f5', primaryBorderColor:'#d4d4d8', primaryTextColor:'#18181b', lineColor:'#a1a1aa', fontSize:'14px' } });
    await mermaid.run({ querySelector: '.mermaid' });
  } catch (e) {
    document.getElementById('mrd-graph').style.display = 'none';
    document.getElementById('mrd-fallback').style.display = 'block';
  }
</script>
